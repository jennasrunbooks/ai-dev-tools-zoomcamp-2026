# Dev-only credentials, matching compose.yaml's Postgres setup for Q4.
# Not fit for anything beyond local kind clusters.
apiVersion: v1
kind: Secret
metadata:
  name: agent-relay-db
type: Opaque
stringData:
  POSTGRES_USER: agent_relay
  POSTGRES_PASSWORD: agent_relay
  POSTGRES_DB: agent_relay
  DATABASE_URL: postgresql://agent_relay:agent_relay@postgres:5432/agent_relay
