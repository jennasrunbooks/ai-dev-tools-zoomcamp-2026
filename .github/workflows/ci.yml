name: CI/CD

on:
  workflow_dispatch:

env:
  WORKING_DIR: 03-deployment/agent-relay
  IMAGE_NAME: agent-relay
  KIND_CLUSTER: agent-relay

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agent_relay
          POSTGRES_PASSWORD: agent_relay
          POSTGRES_DB: agent_relay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_relay -d agent_relay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RELAY_DATABASE_URL: postgresql://agent_relay:agent_relay@localhost:5432/agent_relay
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run protocol tests against PostgreSQL
        run: uv run pytest test_agent_relay.py -v

      - name: Start API against PostgreSQL
        run: |
          uv run uvicorn main:app --host 0.0.0.0 --port 8000 &
          echo $! > /tmp/uvicorn.pid
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          echo "API never became healthy" >&2
          exit 1

      - name: Run live integration test against PostgreSQL
        env:
          RELAY_BASE_URL: http://127.0.0.1:8000
        run: uv run pytest tests/integration/test_integration_live.py -v

      - name: Stop API
        if: always()
        run: kill "$(cat /tmp/uvicorn.pid)" 2>/dev/null || true

  build:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute unique image tag
        id: tag
        run: |
          sha=$(git rev-parse --short HEAD)
          echo "tag=${sha}-$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: docker build -t "${IMAGE_NAME}:${{ steps.tag.outputs.tag }}" .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    env:
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: 'latest'

      - name: Install kind CLI
        uses: helm/kind-action@v1
        with:
          install_only: true

      - name: Load image into kind
        run: kind load docker-image "${IMAGE_NAME}:${IMAGE_TAG}" --name "${KIND_CLUSTER}"

      - name: Apply manifests
        run: kubectl apply -f k8s/

      - name: Roll out new image
        run: |
          kubectl set image deployment/agent-relay "agent-relay=${IMAGE_NAME}:${IMAGE_TAG}"
          kubectl rollout status deployment/agent-relay --timeout=120s
